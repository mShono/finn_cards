[project]
name = "finn-cards"
version = "0.1.0"
description = "FST-verified flashcard generator for Finnish (Kielikaveri phase 0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uralicnlp>=2.1.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn_cards"]
