repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # "gitleaks" (language: golang) needs a Go toolchain to build - use
      # the prebuilt binary instead: brew/apt install gitleaks, or download
      # from https://github.com/gitleaks/gitleaks/releases.
      - id: gitleaks-system

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match pyproject.toml's ruff==... exactly - ruff-format's
    # output changes between versions, so a mismatch here means pre-commit
    # and `ruff format --check` in CI disagree on the same file.
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
